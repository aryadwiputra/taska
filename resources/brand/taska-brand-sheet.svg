<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1760" width="1200" height="1760" font-family="Inter">
  <rect width="1200" height="1760" fill="#FFFFFF"/>

  <!-- header -->
  <text x="80" y="112" font-size="64" font-weight="700" letter-spacing="-2" fill="#0F172A">Taska</text>
  <text x="80" y="152" font-size="22" fill="#64748B">Project work, clearly connected.</text>
  <line x1="80" y1="186" x2="1120" y2="186" stroke="#E2E8F0" stroke-width="2"/>

  <!-- symbol -->
  <text x="80" y="248" font-size="22" font-weight="600" fill="#0F172A">Symbol</text>
  <g transform="translate(80 280) scale(0.95)">
    <rect x="40" y="48" width="176" height="44" rx="16" fill="#0F172A"/>
    <rect x="92" y="106" width="72" height="44" rx="16" fill="#2563EB"/>
    <rect x="92" y="164" width="72" height="44" rx="16" fill="#2563EB"/>
  </g>
  <text x="400" y="330" font-size="18" fill="#334155">Three stacked task cards form a T: the initial, a list, and flow.</text>
  <text x="400" y="362" font-size="18" fill="#334155">Navy bar is the frame; the two blue cards are active work.</text>
  <text x="400" y="394" font-size="18" fill="#334155">Built on a 16-unit grid: one radius (16), one gap (14).</text>
  <text x="400" y="426" font-size="18" fill="#334155">The stack is the identity motif, repeated as board columns and list rows.</text>

  <!-- lockups -->
  <text x="80" y="600" font-size="22" font-weight="600" fill="#0F172A">Lockups</text>
  <g transform="translate(80 620) scale(0.40)">
    <g transform="translate(28 28) scale(0.78125)">
      <rect x="40" y="48" width="176" height="44" rx="16" fill="#0F172A"/>
      <rect x="92" y="106" width="72" height="44" rx="16" fill="#2563EB"/>
      <rect x="92" y="164" width="72" height="44" rx="16" fill="#2563EB"/>
    </g>
    <text x="248" y="184" font-size="148" font-weight="700" letter-spacing="-4" fill="#0F172A">Taska</text>
  </g>
  <text x="80" y="760" font-size="16" fill="#64748B">Horizontal: primary lockup.</text>
  <g transform="translate(700 600) scale(0.28)">
    <g transform="translate(56 32) scale(1.5625)">
      <rect x="40" y="48" width="176" height="44" rx="16" fill="#0F172A"/>
      <rect x="92" y="106" width="72" height="44" rx="16" fill="#2563EB"/>
      <rect x="92" y="164" width="72" height="44" rx="16" fill="#2563EB"/>
    </g>
    <text x="256" y="580" text-anchor="middle" font-size="150" font-weight="700" letter-spacing="-4" fill="#0F172A">Taska</text>
  </g>
  <text x="700" y="800" font-size="16" fill="#64748B">Stacked: narrow spaces.</text>

  <!-- colour -->
  <text x="80" y="856" font-size="22" font-weight="600" fill="#0F172A">Colour</text>
  <g>
    <rect x="80" y="880" width="180" height="96" rx="10" fill="#0F172A"/>
    <text x="80" y="1002" font-size="15" font-weight="600" fill="#0F172A">Navy</text>
    <text x="80" y="1022" font-size="14" fill="#64748B">#0F172A</text>
  </g>
  <g>
    <rect x="280" y="880" width="180" height="96" rx="10" fill="#2563EB"/>
    <text x="280" y="1002" font-size="15" font-weight="600" fill="#0F172A">Blue</text>
    <text x="280" y="1022" font-size="14" fill="#64748B">#2563EB</text>
  </g>
  <g>
    <rect x="480" y="880" width="180" height="96" rx="10" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="2"/>
    <text x="480" y="1002" font-size="15" font-weight="600" fill="#0F172A">Surface</text>
    <text x="480" y="1022" font-size="14" fill="#64748B">#F1F5F9</text>
  </g>
  <g>
    <rect x="680" y="880" width="180" height="96" rx="10" fill="#64748B"/>
    <text x="680" y="1002" font-size="15" font-weight="600" fill="#0F172A">Muted</text>
    <text x="680" y="1022" font-size="14" fill="#64748B">#64748B</text>
  </g>
  <g>
    <rect x="880" y="880" width="180" height="96" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <text x="880" y="1002" font-size="15" font-weight="600" fill="#0F172A">Base</text>
    <text x="880" y="1022" font-size="14" fill="#64748B">#FFFFFF</text>
  </g>
  <text x="80" y="1068" font-size="16" fill="#64748B">Two brand colours plus neutrals. One-colour and reversed versions must always work.</text>

  <!-- clear space and sizes -->
  <text x="80" y="1140" font-size="22" font-weight="600" fill="#0F172A">Clear space and minimum size</text>
  <rect x="80" y="1170" width="336" height="256" fill="none" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="8 8"/>
  <g transform="translate(120 1202) scale(0.85)">
    <rect x="40" y="48" width="176" height="44" rx="16" fill="#0F172A"/>
    <rect x="92" y="106" width="72" height="44" rx="16" fill="#2563EB"/>
    <rect x="92" y="164" width="72" height="44" rx="16" fill="#2563EB"/>
  </g>
  <text x="80" y="1454" font-size="15" fill="#64748B">Clear space = top-bar height on all sides.</text>
  <text x="520" y="1210" font-size="16" fill="#334155">Minimum sizes</text>
  <g transform="translate(520 1230)">
    <g transform="scale(0.30)"><rect x="40" y="48" width="176" height="44" rx="16" fill="#0F172A"/><rect x="92" y="106" width="72" height="44" rx="16" fill="#2563EB"/><rect x="92" y="164" width="72" height="44" rx="16" fill="#2563EB"/></g>
    <text x="100" y="80" font-size="14" fill="#64748B">76 px digital</text>
  </g>
  <g transform="translate(520 1330)">
    <g transform="scale(0.18)"><rect x="40" y="48" width="176" height="44" rx="16" fill="#0F172A"/><rect x="92" y="106" width="72" height="44" rx="16" fill="#2563EB"/><rect x="92" y="164" width="72" height="44" rx="16" fill="#2563EB"/></g>
    <text x="80" y="60" font-size="14" fill="#64748B">16 px: use the small-size cut</text>
  </g>

  <!-- icons -->
  <text x="80" y="1530" font-size="22" font-weight="600" fill="#0F172A">App and web icons</text>
  <rect x="80" y="1560" width="180" height="180" rx="40" fill="#2563EB"/>
  <g transform="translate(80 1560) scale(0.703)">
    <g transform="translate(58 58) scale(0.55)">
      <rect x="40" y="48" width="176" height="44" rx="16" fill="#FFFFFF"/>
      <rect x="92" y="106" width="72" height="44" rx="16" fill="#FFFFFF"/>
      <rect x="92" y="164" width="72" height="44" rx="16" fill="#FFFFFF"/>
    </g>
  </g>
  <text x="80" y="1770" font-size="15" fill="#64748B">App icon</text>
  <g transform="translate(300 1560)">
    <rect x="0" y="0" width="88" height="88" rx="20" fill="#2563EB"/>
    <g transform="translate(0 0) scale(0.344)">
      <g transform="translate(56 56) scale(0.55)">
        <rect x="40" y="48" width="176" height="44" rx="16" fill="#FFFFFF"/>
        <rect x="92" y="106" width="72" height="44" rx="16" fill="#FFFFFF"/>
        <rect x="92" y="164" width="72" height="44" rx="16" fill="#FFFFFF"/>
      </g>
    </g>
    <text x="0" y="120" font-size="14" fill="#64748B">48</text>
  </g>
  <g transform="translate(420 1560)">
    <rect x="0" y="0" width="48" height="48" rx="11" fill="#2563EB"/>
    <g transform="translate(0 0) scale(0.188)">
      <g transform="translate(56 56) scale(0.55)">
        <rect x="40" y="48" width="176" height="44" rx="16" fill="#FFFFFF"/>
        <rect x="92" y="106" width="72" height="44" rx="16" fill="#FFFFFF"/>
        <rect x="92" y="164" width="72" height="44" rx="16" fill="#FFFFFF"/>
      </g>
    </g>
    <text x="0" y="80" font-size="14" fill="#64748B">32</text>
  </g>
  <g transform="translate(500 1560)">
    <rect x="0" y="0" width="28" height="28" rx="7" fill="#2563EB"/>
    <g transform="translate(0 0) scale(0.109)">
      <g transform="translate(56 56) scale(0.55)">
        <rect x="40" y="48" width="176" height="44" rx="16" fill="#FFFFFF"/>
        <rect x="92" y="106" width="72" height="44" rx="16" fill="#FFFFFF"/>
        <rect x="92" y="164" width="72" height="44" rx="16" fill="#FFFFFF"/>
      </g>
    </g>
    <text x="0" y="60" font-size="14" fill="#64748B">16</text>
  </g>
</svg>
